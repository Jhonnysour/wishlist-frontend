name: Build APK

# Compila el APK de release y mantiene UN solo Release, con el tag fijo
# `latest`, siempre sobre el commit recien construido. Para descargar, la URL
# fija de siempre:
#   https://github.com/Jhonnysour/wishlist-frontend/releases/latest/download/app-release.apk
#
# La URL del backend y la publishable key de Supabase se inyectan en tiempo de
# build desde las *Variables* de Actions (Settings -> Secrets and variables ->
# Actions -> Variables): API_BASE_URL y SUPABASE_PUBLISHABLE_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para crear/actualizar el Release con el APK.
permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin secreto de keystore: el release usara la firma debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "Firma de release configurada."

      # El nombre de version sale de pubspec.yaml (sigue siendo correcto al subir
      # a 1.1.0 sin tocar este archivo) y el build number del run de Actions, que
      # es monotonico y sirve de versionCode.
      - name: Derivar la version del build
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      # Un release por build dejaba la pagina llena y, peor, desordenada: los
      # tags v<version>+<run> solo se diferencian en el `+N`, que semver ignora
      # al comparar, asi que todos empataban y el mas nuevo no quedaba arriba.
      # Se borra el anterior (con su tag) y se publica de cero, de modo que
      # siempre haya UNO apuntando al commit que produjo este APK.
      - name: Borrar el release anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publicar el APK como release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          body: |
            Commit: ${{ github.sha }}
            versionCode: ${{ github.run_number }}

            ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/app-release.apk
