name: Build APK

# Compila el APK de release y lo publica en el Release "latest" del repo.
# La URL del backend y la publishable key de Supabase se inyectan en tiempo de
# build desde las *Variables* de Actions (Settings -> Secrets and variables ->
# Actions -> Variables): API_BASE_URL y SUPABASE_PUBLISHABLE_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para crear/actualizar el Release con el APK.
permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: build/app/outputs/flutter-apk/app-release.apk
