org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El plugin receive_sharing_intent (1.8.x) no fija jvmTarget, así que su Java
# compila a 1.8 y su Kotlin al JDK del build (21). Como es un plugin de channels
# sin código Java propio, degradamos esa validación a warning para que el build
# no falle; el bytecode se dexea sin problema.
kotlin.jvm.target.validation.mode=warning
